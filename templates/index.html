<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krishi Chakshu - Plant Disease Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.drag-over {
            border-color: #764ba2;
            background: #e8ebff;
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #333;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .upload-hint {
            color: #999;
            font-size: 12px;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .preview {
            margin-bottom: 20px;
            display: none;
        }

        .preview img {
            width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .result.success {
            background: #f0fdf4;
            border-left: 4px solid #22c55e;
        }

        .result.error {
            background: #fef2f2;
            border-left: 4px solid #ef4444;
        }

        .result-label {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .result.success .result-label {
            color: #22c55e;
        }

        .result.error .result-label {
            color: #ef4444;
        }

        .result-message {
            color: #555;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .confidence-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0;
            transition: width 0.3s ease;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌱 Krishi Chakshu</h1>
            <p>Plant Disease Detection</p>
        </div>

        <form id="uploadForm">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📸</div>
                <div class="upload-text">Click or drag plant image here</div>
                <div class="upload-hint">JPG or PNG, Max 16MB</div>
                <input type="file" id="fileInput" accept="image/jpeg,image/png" />
            </div>

            <div class="preview" id="preview">
                <img id="previewImg" alt="Preview" />
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #666;">Analyzing...</p>
            </div>

            <button type="button" class="btn btn-primary" id="uploadBtn" style="display: none;">Upload & Predict</button>
        </form>

        <div class="result" id="result"></div>

        <div class="footer">
            <p>Made with ❤️ for farmers</p>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const preview = document.getElementById('preview');
        const previewImg = document.getElementById('previewImg');
        const result = document.getElementById('result');
        const loading = document.getElementById('loading');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                handleFileSelect();
            }
        });

        fileInput.addEventListener('change', handleFileSelect);

        function handleFileSelect() {
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                preview.style.display = 'block';
                uploadBtn.style.display = 'block';
                result.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        uploadBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            loading.style.display = 'block';
            uploadBtn.disabled = true;

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                loading.style.display = 'none';
                uploadBtn.disabled = false;

                displayResult(data);
            } catch (error) {
                loading.style.display = 'none';
                uploadBtn.disabled = false;
                displayResult({
                    status: 'error',
                    message: 'Network error. Please try again.'
                });
            }
        });

        function displayResult(data) {
            if (data.status === 'error') {
                result.className = 'result error';
                result.innerHTML = `
                    <div class="result-label">⚠️ Error</div>
                    <div class="result-message">${data.message}</div>
                `;
            } else {
                const isHealthy = !data.is_ill;
                const icon = isHealthy ? '✅' : '⚠️';
                result.className = `result ${isHealthy ? 'success' : 'error'}`;
                const confidence = (data.confidence * 100).toFixed(1);
                result.innerHTML = `
                    <div class="result-label">${icon} ${data.label}</div>
                    <div class="result-message">${data.message}</div>
                    <div class="confidence-bar">
                        <div class="confidence-fill" style="width: ${confidence}%;"></div>
                    </div>
                    <div style="text-align: center; margin-top: 8px; color: #666; font-size: 12px;">
                        Confidence: ${confidence}%
                    </div>
                `;
            }
            result.style.display = 'block';
        }
    </script>
</body>
</html>
